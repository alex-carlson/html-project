<html>

<head>
    <title>Armor and Grace</title>
    <meta charset="UTF-8">
    <meta name="description" content="Armor and Grace official store">
    <meta name="keywords" content="Faith, Fashion, and more">
    <meta name="author" content="Alex C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>
    <header>
        <!-- <img src="logo.png" alt="Logo"> -->
        <h1>Armor and Grace</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../tables.html">Sizing Chart</a></li>
            </ul>
        </nav>
    </header>
    <div class="padding text-center announcement">
        <p>15% off on orders $40 or more — Use code JOHN3:16</p>
    </div>

    <section class="padding full-width products">
        <h1>Accessories</h1>
        <div id="product-list"></div>
    </section>

    <footer class="full-width padding">
        <div class="float-left third">
            <form>
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email">
                <input type="submit" value="Sign Up" onclick="OnButtonClick()">
            </form>
        </div>
        <div class="float-left third">
            <ul class="social">
                <li>
                    <a href="#">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </li>
                <li><a href="#"><i class="fa-brands fa-tiktok"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-youtube youtube"></i></a></li>
            </ul>
        </div>
        <div class="float-left third">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="tables.html">Sizing Chart</a></li>
            </ul>
        </div>
    </footer>
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Checkout</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Checkout service is unavailable, sorry!</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    console.log("Hello world");

    function OnButtonClick() {
        var name = document.getElementById("username").value
        var password = document.getElementById("password").value
        console.log(name);
        alert(name + " Logged in with password: " + password);
    }

    var data = [
        {
            "title": "United Tractors Lanyard",
            "price": "$8.99",
            "image": "https://images.unsplash.com/photo-1769142726489-6f40b1c575c5?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        },
        {
            "title": "United Tractors Lanyard Early Bird",
            "price": "$6.99",
            "image": "https://images.unsplash.com/photo-1769142726489-6f40b1c575c5?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        },
        {
            "title": "Everyday Carry Bundle",
            "price": "$39.99",
            "image": "https://images.unsplash.com/photo-1506169894395-36397e4aaee4?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        },
    ];

    document.getElementById("product-list").innerHTML = data.map(
        product => `
            <article>
                <div class="left">
                    <img src="${product.image}" alt="${product.title}" />
                </div>
                <div class="left padding">
                    <h4>${product.title}</h4>
                    <p>${product.price}</p>
                    <button data-bs-toggle="modal" data-bs-target="#exampleModal">Add to Cart</button>
                </div>
            </article>
        `
    ).join("");
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
